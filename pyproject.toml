[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spx-forecast"
version = "2.0.0"
description = "Leakage-free S&P 500 return forecasting: baselines vs LSTM, evaluated walk-forward."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tensorflow>=2.17,<2.20",
    "streamlit>=1.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
