name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no TensorFlow needed for the test suite)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pytest
      - name: Run tests
        run: pytest -q
